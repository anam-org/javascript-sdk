name: Auto approve low risk and hot fix PRs

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate for auto-approval
        required: true
        type: number
permissions: {}

jobs:
  auto-approve:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'low-risk') || contains(github.event.pull_request.labels.*.name, 'hot-fix')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: anam-org/github-actions/.github/actions/auto-approve@v1.8.0
        with:
          app_private_key: ${{ secrets.ANAM_PUSH_BOT_PRIVATE_KEY }}
          pr_number: ${{ inputs.pr_number }}
